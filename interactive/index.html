<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What do forecasters say they don't know?</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface-1: #fcfcfb;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface-1: #1a1a19;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --critical: #d03b3b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --critical: #d03b3b;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 20px 40px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 14px; margin-top: 6px; max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0 14px; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  select {
    font: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px;
  }
  .tabs { display: flex; gap: 2px; margin-left: auto; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .tabs button {
    font: inherit; font-size: 13px; border: 0; background: transparent;
    color: var(--text-secondary); padding: 5px 12px; border-radius: 6px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--page); color: var(--text-primary); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 10px; position: relative; }
  .panel h2 { font-size: 15px; font-weight: 600; }
  .panel .note { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }
  svg { width: 100%; height: auto; display: block; margin-top: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 8px 2px 6px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; color: var(--text-primary);
    box-shadow: 0 4px 14px rgba(0,0,0,0.12); min-width: 150px; z-index: 3;
  }
  .tooltip .t-year { font-weight: 650; margin-bottom: 4px; }
  .tooltip .row { display: flex; justify-content: space-between; gap: 14px; color: var(--text-secondary); }
  .tooltip .row b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
  footer { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.5; max-width: 90ch; }
  details { margin-top: 14px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--text-secondary); }
  table { border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 10px; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
  th { color: var(--muted); font-weight: 600; }
  td:first-child, th:first-child { text-align: left; }
</style>
</head>
<body>
<div class="wrap">
  <h1>What do forecasters say they don't know?</h1>
  <p class="sub">Uncertainty elicited from professional forecasters' own probability
  distributions, decomposed by the law of total variance: the average forecaster's
  stated uncertainty, the disagreement between forecasters, and the pooled total.</p>

  <div class="controls">
    <label>Survey
      <select id="survey"><option>US SPF (Philadelphia Fed)</option><option disabled>ECB SPF — pipeline in progress</option></select>
    </label>
    <label>Variable
      <select id="variable"><option>Real GDP growth</option><option disabled>Inflation, unemployment — pipeline in progress</option></select>
    </label>
    <label>Horizon
      <select id="horizon"><option>Next year (Q1 rounds)</option></select>
    </label>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-view="decomposition" aria-selected="true">Decomposition</button>
      <button role="tab" data-view="fan" aria-selected="false">Consensus fan</button>
      <button role="tab" data-view="calibration" aria-selected="false">Calibration</button>
    </div>
  </div>

  <div class="panel" id="panel">
    <h2 id="chart-title"></h2>
    <p class="note" id="chart-note"></p>
    <div class="legend" id="legend"></div>
    <svg id="chart" viewBox="0 0 960 460" role="img" aria-label="Forecast uncertainty chart"></svg>
    <div class="tooltip" id="tooltip"></div>
    <details><summary>Data table</summary><div id="table"></div></details>
  </div>

  <footer id="source"></footer>
</div>

<script src="data.js"></script>
<script>
const svg = document.getElementById('chart');
const tt = document.getElementById('tooltip');
const NS = 'http://www.w3.org/2000/svg';
const M = { l: 52, r: 148, t: 14, b: 34 }, W = 960, H = 460;
const iw = W - M.l - M.r, ih = H - M.t - M.b;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let view = 'decomposition';

function el(name, attrs, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  svg.appendChild(e);
  return e;
}
function scales(years, lo, hi) {
  const x = y => M.l + (y - years[0]) / (years[years.length - 1] - years[0]) * iw;
  const y = v => M.t + (hi - v) / (hi - lo) * ih;
  return { x, y };
}
function axes(years, lo, hi, step, fmt) {
  for (let v = lo; v <= hi + 1e-9; v += step) {
    const yy = M.t + (hi - v) / (hi - lo) * ih;
    el('line', { x1: M.l, x2: W - M.r, y1: yy, y2: yy, stroke: v === 0 ? css('--baseline') : css('--grid'), 'stroke-width': 1 });
    el('text', { x: M.l - 8, y: yy + 4, 'text-anchor': 'end', 'font-size': 12, fill: css('--muted') }, fmt(v));
  }
  const { x } = scales(years, lo, hi);
  for (const yr of years) if (yr % 5 === 0)
    el('text', { x: x(yr), y: H - M.b + 20, 'text-anchor': 'middle', 'font-size': 12, fill: css('--muted') }, yr);
}
function path(pts, sx, sy, stroke, dash) {
  const d = pts.map((p, i) => (i ? 'L' : 'M') + sx(p[0]).toFixed(1) + ',' + sy(p[1]).toFixed(1)).join(' ');
  el('path', { d, fill: 'none', stroke, 'stroke-width': 2, ...(dash ? { 'stroke-dasharray': dash } : {}) });
}
function band(rows, sx, sy, loK, hiK, fill) {
  const up = rows.map(r => sx(r.year).toFixed(1) + ',' + sy(r[hiK]).toFixed(1));
  const dn = rows.slice().reverse().map(r => sx(r.year).toFixed(1) + ',' + sy(r[loK]).toFixed(1));
  el('path', { d: 'M' + up.concat(dn).join(' L') + ' Z', fill, opacity: 0.16 });
}
function endLabel(yr, val, sx, sy, color, text) {
  el('circle', { cx: sx(yr), cy: sy(val), r: 3.5, fill: color });
  el('text', { x: sx(yr) + 8, y: sy(val) + 4, 'font-size': 12.5, 'font-weight': 600, fill: css('--text-secondary') }, text);
}
function legend(items) {
  document.getElementById('legend').innerHTML = items.map(i =>
    `<span class="key"><span class="swatch" style="background:${i.c}"></span>${i.t}</span>`).join('');
}
function hover(years, render) {
  const rect = el('rect', { x: M.l, y: M.t, width: iw, height: ih, fill: 'transparent' });
  const guide = el('line', { x1: 0, x2: 0, y1: M.t, y2: M.t + ih, stroke: css('--baseline'), 'stroke-width': 1, opacity: 0 });
  rect.addEventListener('mousemove', ev => {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const span = years[years.length - 1] - years[0];
    const yr = Math.round(years[0] + (p.x - M.l) / iw * span);
    if (yr < years[0] || yr > years[years.length - 1]) return;
    const gx = M.l + (yr - years[0]) / span * iw;
    guide.setAttribute('x1', gx); guide.setAttribute('x2', gx); guide.setAttribute('opacity', 0.6);
    const html = render(yr);
    if (!html) { tt.style.display = 'none'; return; }
    tt.innerHTML = html; tt.style.display = 'block';
    const pr = document.getElementById('panel').getBoundingClientRect();
    const left = ev.clientX - pr.left + 14, maxL = pr.width - tt.offsetWidth - 8;
    tt.style.left = Math.min(left, maxL) + 'px';
    tt.style.top = (ev.clientY - pr.top - 10) + 'px';
  });
  rect.addEventListener('mouseleave', () => { tt.style.display = 'none'; guide.setAttribute('opacity', 0); });
}
function row(label, val) { return `<div class="row"><span>${label}</span><b>${val}</b></div>`; }
function table(headers, rows) {
  document.getElementById('table').innerHTML =
    '<table><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>' +
    rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>';
}

const VIEWS = {
  decomposition() {
    const d = DATA.decomposition, years = d.map(r => r.year);
    document.getElementById('chart-title').textContent = 'Total stated uncertainty and its parts';
    document.getElementById('chart-note').textContent =
      'Pooled standard deviation of next-year real GDP growth: total = average individual uncertainty + disagreement (law of total variance).';
    axes(years, 0, 2.5, 0.5, v => v.toFixed(1) + 'pp');
    const { x, y } = scales(years, 0, 2.5);
    const S = [['total', css('--series-1'), 'Total (pooled)'], ['within', css('--series-2'), 'Average individual'], ['disagreement', css('--series-3'), 'Disagreement']];
    for (const [k, c] of S) path(d.map(r => [r.year, r[k]]), x, y, c);
    for (const [k, c, t] of S) endLabel(years[years.length - 1], d[d.length - 1][k], x, y, c, t.split(' ')[0] + ' ' + d[d.length - 1][k].toFixed(2));
    legend(S.map(([k, c, t]) => ({ c, t })));
    hover(years, yr => {
      const r = d.find(q => q.year === yr); if (!r) return null;
      return `<div class="t-year">${yr} (n=${r.n})</div>` + row('Total', r.total.toFixed(2) + 'pp') +
        row('Individual', r.within.toFixed(2) + 'pp') + row('Disagreement', r.disagreement.toFixed(2) + 'pp') +
        row('Between share', (100 * r.share_between).toFixed(0) + '%');
    });
    table(['Year', 'n', 'Total', 'Individual', 'Disagreement', 'Between share'],
      d.map(r => [r.year, r.n, r.total.toFixed(2), r.within.toFixed(2), r.disagreement.toFixed(2), (100 * r.share_between).toFixed(0) + '%']));
  },
  fan() {
    const ny = DATA.fan.next_year, ty = DATA.fan.ten_year;
    const years = ny.map(r => r.year);
    document.getElementById('chart-title').textContent = 'The consensus — next year, and the next decade';
    document.getElementById('chart-note').textContent =
      'Median and interquartile range across forecasters: next-year density means vs 10-year average annual growth (point forecasts).';
    axes(years, -1, 5, 1, v => v + '%');
    const { x, y } = scales(years, -1, 5);
    band(ny.map(r => ({ year: r.year, lo: r.p25, hi: r.p75 })), x, y, 'lo', 'hi', css('--series-1'));
    band(ty.map(r => ({ year: r.year, lo: r.p25, hi: r.p75 })), x, y, 'lo', 'hi', css('--series-2'));
    path(ny.map(r => [r.year, r.median]), x, y, css('--series-1'));
    path(ty.map(r => [r.year, r.median]), x, y, css('--series-2'), '7 5');
    const l1 = ny[ny.length - 1], l2 = ty[ty.length - 1];
    endLabel(l1.year, l1.median, x, y, css('--series-1'), l1.median.toFixed(1) + '% · IQR ' + (l1.p75 - l1.p25).toFixed(1));
    endLabel(l2.year, l2.median, x, y, css('--series-2'), l2.median.toFixed(1) + '% · IQR ' + (l2.p75 - l2.p25).toFixed(1));
    legend([{ c: css('--series-1'), t: 'Next year — median + IQR' }, { c: css('--series-2'), t: 'Next 10 years, avg annual — median + IQR' }]);
    hover(years, yr => {
      const a = ny.find(q => q.year === yr), b = ty.find(q => q.year === yr);
      if (!a) return null;
      let h = `<div class="t-year">${yr}</div>` + row('Next yr median', a.median.toFixed(2) + '%') + row('Next yr IQR', (a.p75 - a.p25).toFixed(2) + 'pp');
      if (b) h += row('10-yr median', b.median.toFixed(2) + '%') + row('10-yr IQR', (b.p75 - b.p25).toFixed(2) + 'pp');
      return h;
    });
    table(['Year', 'Next-yr median', 'Next-yr IQR', '10-yr median', '10-yr IQR'],
      years.map(yr => {
        const a = ny.find(q => q.year === yr), b = ty.find(q => q.year === yr);
        return [yr, a.median.toFixed(2), (a.p75 - a.p25).toFixed(2), b ? b.median.toFixed(2) : '', b ? (b.p75 - b.p25).toFixed(2) : ''];
      }));
  },
  calibration() {
    const d = DATA.calibration, years = d.map(r => r.year);
    document.getElementById('chart-title').textContent = 'Did the stated distributions cover what happened?';
    document.getElementById('chart-note').textContent =
      'Consensus forecast ± total pooled SD vs realized growth. Coverage 23 of 33 years (70%); misses cluster in regime shifts.';
    axes(years, -5, 7, 2, v => v + '%');
    const { x, y } = scales(years, -5, 7);
    band(d.map(r => ({ year: r.year, lo: r.forecast - r.total, hi: r.forecast + r.total })), x, y, 'lo', 'hi', css('--series-1'));
    path(d.map(r => [r.year, r.forecast]), x, y, css('--series-1'));
    let prevMiss = null, tier = false;
    for (const r of d) {
      if (r.inside) {
        el('circle', { cx: x(r.year), cy: y(r.realized), r: 4, fill: css('--text-primary') });
      } else {
        el('circle', { cx: x(r.year), cy: y(r.realized), r: 5, fill: 'none', stroke: css('--critical'), 'stroke-width': 2.5 });
        tier = prevMiss === r.year - 1 ? !tier : false;
        const dy = r.realized > r.forecast ? (tier ? -24 : -11) : (tier ? 32 : 19);
        el('text', { x: x(r.year), y: y(r.realized) + dy, 'text-anchor': 'middle', 'font-size': 11, fill: css('--text-secondary') }, r.year);
        prevMiss = r.year;
      }
    }
    legend([{ c: css('--series-1'), t: 'Consensus ± total stated SD' }, { c: css('--text-primary'), t: 'Realized, inside band' }, { c: css('--critical'), t: 'Realized, outside band (miss)' }]);
    hover(years, yr => {
      const r = d.find(q => q.year === yr); if (!r) return null;
      return `<div class="t-year">Target ${yr}</div>` + row('Forecast', r.forecast.toFixed(2) + '%') +
        row('Realized', r.realized.toFixed(1) + '%') + row('Error', (r.realized - r.forecast).toFixed(2) + 'pp') +
        row('Band ±', r.total.toFixed(2) + 'pp') + row('Covered', r.inside ? 'yes' : 'no');
    });
    table(['Target', 'Forecast', 'Realized', 'Error', '± band', 'Covered'],
      d.map(r => [r.year, r.forecast.toFixed(2), r.realized.toFixed(1), (r.realized - r.forecast).toFixed(2), r.total.toFixed(2), r.inside ? 'yes' : 'no']));
  },
};

function render() {
  svg.innerHTML = '';
  tt.style.display = 'none';
  VIEWS[view]();
  document.getElementById('source').textContent = 'Source: ' + DATA.meta.source +
    ' Currently showing the validated seed series (US SPF, real GDP growth); the full survey × variable × horizon matrix loads from the pipeline outputs.';
}
document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  view = b.dataset.view;
  for (const t of document.querySelectorAll('#tabs button')) t.setAttribute('aria-selected', t === b);
  render();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
render();
</script>
</body>
</html>
